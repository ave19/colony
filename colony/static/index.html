<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Colony</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1><span>COLONY</span> · orbital logistics</h1>
      <div class="hdr-meta">
        <div>Phase: <strong id="phase">—</strong></div>
        <div>Time: <strong id="clock">—</strong></div>
        <div>Pop: <strong id="pop">—</strong></div>
        <button type="button" id="btn-warp" class="primary" title="Vote-warp to next event (solo auto-approve)">Warp → event</button>
        <button type="button" id="btn-refresh">Refresh</button>
      </div>
    </header>

    <aside class="left">
      <div id="panel-menu">
        <h2>Star survey</h2>
        <p class="muted">You are a colony ship. Pick a destination. Transit commits you — no galaxy map mid-run.</p>
        <button type="button" id="btn-catalog" class="primary">Scan nearby stars</button>
        <div id="catalog"></div>
      </div>

      <div id="panel-transit" hidden>
        <h2>In transit</h2>
        <p class="muted" id="transit-msg"></p>
        <button type="button" id="btn-warp-transit" class="primary">Warp to arrival</button>
      </div>

      <div id="panel-system" hidden>
        <h2>Selected body</h2>
        <div id="body-detail" class="empty">Click a body on the map</div>
        <div id="plan-box" hidden>
          <h2>Plan a base</h2>
          <div class="plan-form card">
            <label>Power
              <select id="power-id">
                <option value="solar">Solar</option>
                <option value="chemical">Chemical genset</option>
                <option value="fusion">Fusion (long path)</option>
              </select>
            </label>
            <label>Habitation
              <select id="hab-id">
                <option value="underground">Underground</option>
                <option value="surface">Surface</option>
              </select>
            </label>
            <div class="row">
              <button type="button" id="btn-plan" class="primary">Create project → contracts</button>
            </div>
          </div>
        </div>
        <h2>Haul from ark</h2>
        <div class="card plan-form">
          <label>Resource
            <select id="haul-resource"></select>
          </label>
          <label>Amount (t)
            <input id="haul-amount" type="number" value="10" min="0.1" step="1" style="width:100%;margin-top:2px;background:var(--panel2);color:var(--text);border:1px solid #334455;border-radius:6px;padding:6px 10px;" />
          </label>
          <label>Destination body id
            <input id="haul-dest" type="text" placeholder="p0" style="width:100%;margin-top:2px;background:var(--panel2);color:var(--text);border:1px solid #334455;border-radius:6px;padding:6px 10px;" />
          </label>
          <div class="row">
            <button type="button" id="btn-haul-opts">Show transfer options</button>
          </div>
          <div id="haul-opts"></div>
        </div>
      </div>
    </aside>

    <section class="main">
      <canvas id="map"></canvas>
      <div class="toast" id="toast">Loading…</div>
    </section>

    <aside class="right">
      <h2>Ark stock</h2>
      <div id="ark-stock" class="card stock"></div>
      <h2>Contracts</h2>
      <div id="contracts"></div>
      <h2>Projects</h2>
      <div id="projects"></div>
      <h2>Hauls</h2>
      <div id="hauls"></div>
      <h2>Events</h2>
      <div id="events"></div>
    </aside>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
